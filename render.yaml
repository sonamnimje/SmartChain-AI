services:
  - type: web
    name: smartchain-backend
    env: docker
    repo: https://github.com/sonamnimje/SmartChain-AI
    region: oregon
    branch: main
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        value: your-secret-key
      - key: DATABASE_URL
        fromDatabase:
          name: smartchain-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: smartchain-backend.onrender.com
      - key: CORS_ORIGIN_WHITELIST
        value: https://smartchain-frontend.onrender.com

  - type: static
    name: smartchain-frontend
    repo: https://github.com/sonamnimje/SmartChain-AI
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://smartchain-backend.onrender.com

databases:
  - name: smartchain-db
    region: oregon
    plan: free
