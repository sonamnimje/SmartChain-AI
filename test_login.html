<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
</head>
<body>
    <h1>Login Test</h1>
    <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" value="admin@smartchain.com" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" value="admin123" required><br><br>
        
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch('https://smartchain-ai-backend-imvu.onrender.com/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3>Login Successful!</h3>
                        <p>Token: ${data.access_token}</p>
                        <p>Token Type: ${data.token_type}</p>
                    `;
                    
                    // Test profile fetch
                    const profileResponse = await fetch('https://smartchain-ai-backend-imvu.onrender.com/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${data.access_token}`
                        }
                    });
                    
                    if (profileResponse.ok) {
                        const profileData = await profileResponse.json();
                        resultDiv.innerHTML += `
                            <h3>Profile Data:</h3>
                            <p>Name: ${profileData.name}</p>
                            <p>Email: ${profileData.email}</p>
                            <p>Role: ${profileData.role}</p>
                        `;
                    } else {
                        resultDiv.innerHTML += `<p>Profile fetch failed: ${profileResponse.status}</p>`;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <h3>Login Failed</h3>
                        <p>Status: ${response.status}</p>
                        <p>Error: ${data.detail || 'Unknown error'}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
